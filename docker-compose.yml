services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nori
      POSTGRES_PASSWORD: nori
      POSTGRES_DB: nori
    ports:
      - "5432:5432"
    volumes:
      - nori-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nori -d nori"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nori-postgres-data:
