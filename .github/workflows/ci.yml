name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nori
          POSTGRES_PASSWORD: nori
          POSTGRES_DB: nori
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nori -d nori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nori:nori@localhost:5432/nori
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      - run: npm run db:migrate

      - run: npm run test:integration

      # tests/e2e and tests/fixtures/site are still placeholders (Phase 4+ populates them per
      # the implementation plan's phase checklist) — only the integration suite runs so far.
